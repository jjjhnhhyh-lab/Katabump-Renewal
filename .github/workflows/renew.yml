name: Katabump Auto Renew

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Start Proxy (sing-box)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "PROXY_URL not set, skipping sing-box setup."
            exit 0
          fi
          SINGBOX_VER="1.13.16"
          echo "Downloading sing-box v${SINGBOX_VER}..."
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          python proxy_handler.py
          nohup ./sing-box run -c config.json > singbox.log 2>&1 &
          sleep 24
          if ! pgrep -f "./sing-box" > /dev/null; then
            echo "❌ sing-box process not running"
            exit 1
          fi
          echo "✅ sing-box process alive"
          if ! curl -s -m 30 -x http://127.0.0.1:8080 https://api.ip.sb/ip; then
            echo "❌ proxy connect FAILED"
            exit 1
          fi

      - name: Run Renew Script
        id: renew
        continue-on-error: true
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          PROXY_SERVER: http://127.0.0.1:8080
          IS_PROXY: ${{ secrets.PROXY_URL != '' && 'true' || 'false' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py 2>&1 | tee output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Update status.json
        if: always()
        env:
          EXIT_CODE: ${{ steps.renew.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os, datetime
          from pathlib import Path

          log = ""
          if Path("output.log").exists():
              log = Path("output.log").read_text(encoding="utf-8", errors="ignore")

          exit_code = os.environ.get("EXIT_CODE", "0")
          now = datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z"

          lower = log.lower()
          if "success" in lower and "renew" in lower and "can't renew" not in lower and "cannot renew" not in lower:
              status = "success"
          elif "can't renew" in lower or "cannot renew" in lower or "renew your server yet" in lower:
              status = "too_early"
          elif "invalid" in lower or "failed" in lower or "error" in lower:
              status = "failed"
          else:
              status = "unknown"

          p = Path("status.json")
          data = {"updated": "", "results": []}
          if p.exists():
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  pass

          data["updated"] = now
          data["results"].insert(0, {
              "time": now,
              "status": status,
              "exit_code": exit_code,
              "last_lines": log.strip().splitlines()[-15:],
          })
          data["results"] = data["results"][:30]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print("status.json updated:", status)
          PY

      - name: Commit status.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "update status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-logs
          path: |
            output.log
            singbox.log
          if-no-files-found: ignore
